<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile Scanner - Plickers Math Suite</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
    .box { max-width: 680px; margin: 0 auto; background: #1e293b; padding: 16px; border-radius: 12px; }
    input, select, button { padding: 8px 12px; border-radius: 8px; border: 1px solid #475569; font-size: 14px; }
    button { background: #2563eb; color: #fff; border: none; font-weight: 600; cursor: pointer; }
    video { width: 100%; max-height: 360px; background: #000; border-radius: 10px; margin-top: 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Máy quét thẻ trực tiếp (4 chiều A/B/C/D + mã thẻ 1..40)</h2>
    <div class="row">
      <label>WS URL: <input id="wsUrlInput" type="text" value="" style="width:220px; background:#0f172a; color:#fff;" /></label>
      <button id="btnConnectWs">Kết nối WS</button>
      <span id="wsStatus" style="font-size:13px; color:#94a3b8;">Chưa kết nối</span>
    </div>
    <div class="row">
      <label>Mã thẻ (1..40): <input id="manualCardNum" type="number" min="1" max="40" value="1" style="width:70px; background:#0f172a; color:#fff;" /></label>
      <label>Đáp án:
        <select id="manualAnswer" style="background:#0f172a; color:#fff;">
          <option value="A">A (0°)</option>
          <option value="B">B (90°)</option>
          <option value="C">C (180°)</option>
          <option value="D">D (270°)</option>
        </select>
      </label>
      <label>Câu hỏi ID: <input id="questionIdInput" type="text" value="Q001" style="width:90px; background:#0f172a; color:#fff;" /></label>
      <button id="btnSendScan">Gửi đáp án</button>
    </div>
    <div class="row">
      <button id="btnStartCamera">Bật Camera</button>
      <canvas id="scanCanvas" width="320" height="240" style="display:none;"></canvas>
    </div>
    <video id="cameraVideo" autoplay playsinline muted></video>
  </div>

  <script src="./scanner.js"></script>
  <script>
    const defaultWsHost = location.hostname || "localhost";
    const wsInput = document.getElementById("wsUrlInput");
    wsInput.value = `ws://${defaultWsHost}:8080`;

    let ws = null;
    function connectWs() {
      if (ws && ws.readyState === WebSocket.OPEN) ws.close();
      ws = new WebSocket(wsInput.value.trim());
      ws.onopen = () => {
        document.getElementById("wsStatus").textContent = "Đã kết nối";
        document.getElementById("wsStatus").style.color = "#4ade80";
      };
      ws.onclose = () => {
        document.getElementById("wsStatus").textContent = "Ngắt kết nối";
        document.getElementById("wsStatus").style.color = "#f87171";
      };
    }

    document.getElementById("btnConnectWs").addEventListener("click", connectWs);
    document.getElementById("btnSendScan").addEventListener("click", () => {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        alert("Hãy kết nối WebSocket trước.");
        return;
      }
      const num = Math.min(40, Math.max(1, parseInt(document.getElementById("manualCardNum").value, 10) || 1));
      const studentId = String(num).padStart(2, "0");
      const answer = document.getElementById("manualAnswer").value;
      const questionId = document.getElementById("questionIdInput").value.trim() || "Q001";
      ws.send(JSON.stringify({
        type: "scan_answer",
        questionId,
        studentId,
        cardNumber: num,
        answer,
        timestamp: Date.now()
      }));
    });

    document.getElementById("btnStartCamera").addEventListener("click", async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("Trình duyệt không hỗ trợ camera.");
        return;
      }
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      document.getElementById("cameraVideo").srcObject = stream;
    });

    window.addEventListener("DOMContentLoaded", connectWs);
  </script>
</body>
</html>
